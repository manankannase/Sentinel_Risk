[project]
name = "sentinel-risk"
version = "1.0.0"
description = "Auditable real-time fraud risk scoring and analytics"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.16.0,<3",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
  "confluent-kafka>=2.8,<3", "numpy>=2,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "xgboost-cpu>=3.4.1,<4; sys_platform == 'linux'",
  "xgboost>=3.4.1,<4; sys_platform != 'linux'", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
ops = ["mlflow>=3,<4", "feast>=0.49,<1", "evidently>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
