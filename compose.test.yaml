name: sentinel-hardening-tests
services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_PASSWORD: local-integration-only
      POSTGRES_USER: sentinel_test
      POSTGRES_DB: sentinel_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_test"]
      interval: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql]
  redis:
    image: redis:8.4.6-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
