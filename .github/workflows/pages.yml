name: Public synthetic demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "demo/**", "artifacts/inr-v2/**", "scripts/build_demo.py", ".github/workflows/pages.yml", "tests/demo_*.cjs", "uv.lock"]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: "0.10.9"}
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/build_demo.py
      - run: node tests/demo_parity.cjs && node tests/demo_flow.cjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with: {path: dist/demo}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
